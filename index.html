<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Finance Tracker</title>
<meta name="theme-color" content="#0b1120"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💷</text></svg>"/>
<style>
:root{
  --bg:#0b1120; --surface:#131c31; --surface2:#1b2740; --border:#24334f;
  --text:#e6edf7; --muted:#8fa3c0; --accent:#3ddc97; --accent2:#5b9dff;
  --danger:#ff6b6b; --warn:#ffb347; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
}
h1,h2,h3{margin:0 0 .5rem;font-weight:600;line-height:1.25}
h2{font-size:18px} h3{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
a{color:var(--accent2)}
.hidden{display:none !important}

/* Topbar */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:.75rem 1rem; padding-top:calc(.75rem + env(safe-area-inset-top));
  background:rgba(11,17,32,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:16px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.topbar-actions{display:flex;gap:.4rem}

/* Tabs */
.tabs{
  display:flex; gap:.25rem; overflow-x:auto; padding:.5rem .75rem;
  border-bottom:1px solid var(--border); background:var(--bg);
  position:sticky; top:calc(52px + env(safe-area-inset-top)); z-index:40;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; padding:.45rem .85rem; border-radius:999px; border:1px solid transparent;
  background:transparent; color:var(--muted); font-size:13.5px; font-weight:500;
  cursor:pointer; font-family:inherit; white-space:nowrap;
}
.tab:hover{color:var(--text); background:var(--surface)}
.tab.active{background:var(--surface2); color:var(--text); border-color:var(--border)}

/* Layout */
main{padding:1rem; max-width:1100px; margin:0 auto}
.grid{display:grid; gap:.75rem}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:1fr}
}
@media(max-width:420px){
  .g2{grid-template-columns:1fr}
}

/* Cards */
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:1rem;
}
.card + .card{margin-top:.75rem}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:.85rem 1rem}
.stat .label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; margin-bottom:.35rem}
.stat .value{font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.stat .sub{font-size:11.5px; color:var(--muted); margin-top:.2rem}
.pos{color:var(--accent)} .neg{color:var(--danger)} .warn{color:var(--warn)}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; gap:.4rem; justify-content:center;
  padding:.55rem .95rem; border-radius:9px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text); font-size:13.5px; font-weight:500;
  cursor:pointer; font-family:inherit; transition:.15s; white-space:nowrap;
}
.btn:hover{background:var(--border)}
.btn-primary{background:var(--accent); color:#04150d; border-color:var(--accent); font-weight:600}
.btn-primary:hover{filter:brightness(1.1)}
.btn-danger{background:transparent; color:var(--danger); border-color:rgba(255,107,107,.35)}
.btn-danger:hover{background:rgba(255,107,107,.12)}
.btn-ghost{background:transparent}
.btn-sm{padding:.35rem .65rem; font-size:12.5px}

/* Forms */
label{display:block; font-size:12px; color:var(--muted); margin-bottom:.3rem; text-transform:uppercase; letter-spacing:.05em}
input,select,textarea{
  width:100%; padding:.6rem .7rem; border-radius:9px;
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  font-size:14.5px; font-family:inherit; outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent2); box-shadow:0 0 0 3px rgba(91,157,255,.13)}
input[type=checkbox]{width:auto; accent-color:var(--accent)}
.field{margin-bottom:.75rem}
.row{display:grid; gap:.6rem}
.row.c2{grid-template-columns:1fr 1fr}
.row.c3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:480px){ .row.c3{grid-template-columns:1fr 1fr} }

/* Tables */
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--radius); border:1px solid var(--border)}
table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:560px}
th{
  text-align:left; padding:.6rem .7rem; background:var(--surface2);
  color:var(--muted); font-weight:500; font-size:11.5px;
  text-transform:uppercase; letter-spacing:.06em; white-space:nowrap;
  position:sticky; top:0;
}
td{padding:.6rem .7rem; border-top:1px solid var(--border); white-space:nowrap}
tbody tr:hover{background:var(--surface)}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
td.actions{text-align:right; white-space:nowrap}
.icon-btn{
  background:transparent; border:none; color:var(--muted); cursor:pointer;
  padding:.25rem .4rem; border-radius:6px; font-size:14px; font-family:inherit;
}
.icon-btn:hover{color:var(--text); background:var(--surface2)}
.empty{padding:2rem 1rem; text-align:center; color:var(--muted); font-size:13.5px}

/* Filters */
.filters{display:flex; gap:.5rem; flex-wrap:wrap; align-items:flex-end; margin-bottom:.75rem}
.filters .field{margin:0; flex:1 1 130px; min-width:120px}
.filters .field.grow{flex:2 1 200px}

/* Banner */
.banner{
  margin:0; padding:.7rem 1rem; font-size:13px;
  background:rgba(255,179,71,.12); color:var(--warn);
  border-bottom:1px solid rgba(255,179,71,.28);
  display:flex; align-items:center; justify-content:space-between; gap:.75rem; flex-wrap:wrap;
}
.banner button{flex:0 0 auto}

/* Modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(4,8,18,.72); backdrop-filter:blur(3px);
  z-index:100; display:flex; align-items:flex-end; justify-content:center;
  padding:0; animation:fade .15s ease;
}
@media(min-width:640px){ .modal-overlay{align-items:center; padding:1rem} }
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px 16px 0 0; width:100%; max-width:520px;
  max-height:92vh; overflow-y:auto;
  padding:1.25rem; padding-bottom:calc(1.25rem + env(safe-area-inset-bottom));
  animation:slide .2s ease;
}
@media(min-width:640px){ .modal{border-radius:16px} }
@keyframes slide{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem}
.modal-head h2{font-size:17px; margin:0}
.modal-foot{display:flex; gap:.5rem; justify-content:flex-end; margin-top:1rem; padding-top:1rem; border-top:1px solid var(--border)}
.modal-foot .btn-danger{margin-right:auto}

/* Chart */
.chart{width:100%; height:auto; display:block}
.legend{display:flex; gap:1rem; font-size:12px; color:var(--muted); margin-top:.5rem; justify-content:center}
.legend span{display:inline-flex; align-items:center; gap:.35rem}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Toast */
#toast{
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none;
  background:var(--surface2); border:1px solid var(--border); color:var(--text);
  padding:.6rem 1rem; border-radius:9px; font-size:13.5px; z-index:200;
  transition:.25s; box-shadow:0 8px 24px rgba(0,0,0,.4); max-width:88vw;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:rgba(61,220,151,.4)} #toast.err{border-color:rgba(255,107,107,.45)}

/* Misc */
.muted{color:var(--muted)} .small{font-size:12.5px}
.divider{height:1px;background:var(--border);margin:1rem 0}
.pill{display:inline-block;padding:.1rem .5rem;border-radius:999px;font-size:11px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.pill.essential{background:rgba(91,157,255,.14);color:var(--accent2);border-color:rgba(91,157,255,.3)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:.75rem;flex-wrap:wrap}
.list-reset{list-style:none;padding:0;margin:0}
.kv{display:flex;justify-content:space-between;padding:.45rem 0;border-bottom:1px solid var(--border);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv span:last-child{font-variant-numeric:tabular-nums;font-weight:500}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span> Finance Tracker</div>
  <div class="topbar-actions">
    <button id="btnQuickBackup" class="btn btn-ghost btn-sm" title="Backup now">⤓ Backup</button>
  </div>
</header>

<div id="backupBanner" class="banner hidden"></div>

<nav class="tabs" id="tabs">
  <button class="tab active" data-view="dashboard">Dashboard</button>
  <button class="tab" data-view="income">Income</button>
  <button class="tab" data-view="expenses">Expenses</button>
  <button class="tab" data-view="accounts">Accounts</button>
  <button class="tab" data-view="reports">Reports</button>
  <button class="tab" data-view="data">Data</button>
</nav>

<main id="main"></main>
<div id="modalRoot"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ============================================================
   CONSTANTS & STATE
   ============================================================ */
const STORAGE_KEY = 'financeTracker.v1';
const PAY_TYPES = [
  {id:'hourly',  label:'Hourly',  qtyLabel:'Hours',  rateLabel:'Rate / hour',  hoursMode:'direct'},
  {id:'daily',   label:'Daily',   qtyLabel:'Days',   rateLabel:'Rate / day',   hoursMode:'derive'},
  {id:'weekly',  label:'Weekly',  qtyLabel:'Weeks',  rateLabel:'Rate / week',  hoursMode:'manual'},
  {id:'monthly', label:'Monthly', qtyLabel:'Months', rateLabel:'Rate / month', hoursMode:'manual'},
  {id:'lump',    label:'One-off', qtyLabel:'Qty',    rateLabel:'Rate',         hoursMode:'manual'}
];

function defaultState(){
  return {
    version: 1,
    currency: '£',
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    lastBackupAt: null,
    settings: {
      hoursPerDay: 8,
      baselineMonthly: 0,
      backupReminderDays: 7,
      accounts: ['Holding','Operating','Savings'],
      incomeSources: ['Client A','Client B','Employer','Gig','Other'],
      expenseCategories: [
        'Rent/Mortgage','Utilities','Groceries','Transport','Insurance',
        'Debt Payment','Healthcare','Dining','Entertainment','Shopping',
        'Subscriptions','Car Maintenance','Gifts','Household','Other'
      ],
      essentialCategories: [
        'Rent/Mortgage','Utilities','Groceries','Transport',
        'Insurance','Debt Payment','Healthcare'
      ]
    },
    openingBalances: { Holding: 0, Operating: 0, Savings: 0 },
    incomes: [],
    expenses: [],
    transfers: []
  };
}

let state = defaultState();

/* ============================================================
   UTILITIES
   ============================================================ */
const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const monthKeyOf = iso => iso.slice(0,7);
const monthLabelOf = key => {
  const [y,m] = key.split('-');
  return new Date(Number(y), Number(m)-1, 1).toLocaleString('en-GB',{month:'short',year:'numeric'});
};
const daysInclusive = (a,b) => Math.max(0, Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000) + 1);
const fmtMoney = n => state.currency + num(n).toLocaleString('en-GB',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmtMoney0 = n => state.currency + Math.round(num(n)).toLocaleString('en-GB');
const fmtDate = iso => {
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
};

function toast(msg, kind){
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'show ' + (kind||'');
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.className = kind||''; }, 2600);
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
function save(){
  state.updatedAt = new Date().toISOString();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {
    toast('Could not save to this browser. Export a backup now!', 'err');
    console.error(e);
  }
}

function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);
    state = migrate(parsed);
    return true;
  } catch(e) {
    console.error('Load failed', e);
    return false;
  }
}

function migrate(data){
  const base = defaultState();
  const out = Object.assign({}, base, data);
  out.settings = Object.assign({}, base.settings, data.settings || {});
  out.openingBalances = Object.assign({}, base.openingBalances, data.openingBalances || {});
  // ensure every account has an opening balance entry
  (out.settings.accounts||[]).forEach(a => {
    if(typeof out.openingBalances[a] !== 'number') out.openingBalances[a] = 0;
  });
  out.incomes  = Array.isArray(data.incomes)  ? data.incomes  : [];
  out.expenses = Array.isArray(data.expenses) ? data.expenses : [];
  out.transfers= Array.isArray(data.transfers)? data.transfers: [];
  return out;
}

/* ============================================================
   METRICS
   ============================================================ */
function metricsFor(fromISO, toISO){
  const inc = state.incomes.filter(i => i.date >= fromISO && i.date <= toISO);
  const exp = state.expenses.filter(e => e.date >= fromISO && e.date <= toISO);

  const totalIncome   = inc.reduce((s,i) => s + num(i.amount), 0);
  const totalExpenses = exp.reduce((s,e) => s + num(e.amount), 0);
  const hours         = inc.reduce((s,i) => s + num(i.hours), 0);
  const workDays      = new Set(inc.map(i => i.date)).size;
  const days          = Math.max(1, daysInclusive(fromISO, toISO));
  const weeks         = days / 7;
  const months        = days / 30.4375;
  const years         = days / 365.25;

  const incomeWithHours = inc.filter(i => num(i.hours) > 0).reduce((s,i) => s + num(i.amount), 0);

  return {
    from: fromISO, to: toISO, days,
    totalIncome, totalExpenses,
    net: totalIncome - totalExpenses,
    hours, workDays,
    incomeCount: inc.length,
    expenseCount: exp.length,
    perHour:  hours > 0     ? totalIncome / hours  : 0,
    perDay:   workDays > 0  ? totalIncome / workDays : 0,
    perWeek:  totalIncome / weeks,
    perMonth: totalIncome / months,
    perYear:  totalIncome / years,
    hoursCoverage: totalIncome > 0 ? incomeWithHours / totalIncome : 0
  };
}

function accountBalance(name){
  let b = num(state.openingBalances[name]);
  state.incomes.forEach(i => { if(i.account === name) b += num(i.amount); });
  state.expenses.forEach(e => { if(e.account === name) b -= num(e.amount); });
  state.transfers.forEach(t => {
    if(t.from === name) b -= num(t.amount);
    if(t.to   === name) b += num(t.amount);
  });
  return b;
}

function totalBalance(){
  return state.settings.accounts.reduce((s,a) => s + accountBalance(a), 0);
}

function lastNMonths(n){
  const out = [];
  const now = new Date();
  for(let i = n-1; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    out.push(key);
  }
  return out;
}

function monthTotals(key){
  const inc = state.incomes.filter(i => monthKeyOf(i.date) === key);
  const exp = state.expenses.filter(e => monthKeyOf(e.date) === key);
  const income = inc.reduce((s,i) => s + num(i.amount), 0);
  const expenses = exp.reduce((s,e) => s + num(e.amount), 0);
  const hours = inc.reduce((s,i) => s + num(i.hours), 0);
  const workDays = new Set(inc.map(i => i.date)).size;
  return {
    key, income, expenses, net: income - expenses,
    hours, workDays,
    perHour: hours > 0 ? income / hours : 0,
    count: inc.length + exp.length
  };
}

/* ============================================================
   RENDER — ROUTER
   ============================================================ */
let currentView = 'dashboard';

function render(){
  const main = $('#main');
  const scrollY = window.scrollY;
  switch(currentView){
    case 'dashboard': main.innerHTML = viewDashboard(); afterDashboard(); break;
    case 'income':    main.innerHTML = viewIncome();    afterIncome();    break;
    case 'expenses':  main.innerHTML = viewExpenses();  afterExpenses();  break;
    case 'accounts':  main.innerHTML = viewAccounts();  afterAccounts();  break;
    case 'reports':   main.innerHTML = viewReports();   afterReports();   break;
    case 'data':      main.innerHTML = viewData();      afterData();      break;
  }
  window.scrollTo(0, scrollY);
  renderBackupBanner();
}

function setView(v){
  currentView = v;
  $$('#tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
  render();
}

/* ============================================================
   VIEW — DASHBOARD
   ============================================================ */
function viewDashboard(){
  const now = new Date();
  const monthStart = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
  const monthEnd   = todayISO() < monthStart ? monthStart : todayISO();
  const thisMonth  = metricsFor(monthStart, monthEnd);

  const d30 = new Date(); d30.setDate(d30.getDate() - 29);
  const from30 = `${d30.getFullYear()}-${String(d30.getMonth()+1).padStart(2,'0')}-${String(d30.getDate()).padStart(2,'0')}`;
  const last30 = metricsFor(from30, todayISO());

  const firstEver = state.incomes.concat(state.expenses).map(x => x.date).sort()[0] || todayISO();
  const allTime   = metricsFor(firstEver, todayISO());

  const series = lastNMonths(12).map(monthTotals);

  const recent = []
    .concat(state.incomes.map(i => ({type:'in',  date:i.date, label:i.source||'Income', amount:num(i.amount),  meta:payTypeLabel(i.payType)})))
    .concat(state.expenses.map(e => ({type:'out', date:e.date, label:e.category||'Expense', amount:num(e.amount), meta:e.description||''})))
    .sort((a,b) => b.date.localeCompare(a.date))
    .slice(0,8);

  const balances = state.settings.accounts.map(a => ({ name:a, bal: accountBalance(a) }));

  return `
  <div class="grid g4" style="margin-bottom:.75rem">
    ${statCard('Income this month', fmtMoney(thisMonth.totalIncome), `${thisMonth.incomeCount} entries`, 'pos')}
    ${statCard('Expenses this month', fmtMoney(thisMonth.totalExpenses), `${thisMonth.expenseCount} entries`, 'neg')}
    ${statCard('Net this month', fmtMoney(thisMonth.net), thisMonth.net >= 0 ? 'Surplus' : 'Deficit', thisMonth.net >= 0 ? 'pos' : 'neg')}
    ${statCard('Effective hourly', thisMonth.hours > 0 ? fmtMoney(thisMonth.perHour) : '—', thisMonth.hours > 0 ? `${thisMonth.hours.toFixed(1)} hrs logged` : 'No hours logged', '')}
  </div>

  <div class="grid g4" style="margin-bottom:.75rem">
    ${statCard('Last 30 days', fmtMoney(last30.totalIncome), `${last30.hours.toFixed(1)} hrs · ${last30.workDays} work days`, '')}
    ${statCard('Per day (30d)', fmtMoney(last30.perDay), 'average earned per work day', '')}
    ${statCard('Per week (30d)', fmtMoney(last30.perWeek), 'average weekly earnings', '')}
    ${statCard('Annual pace', fmtMoney(last30.perYear), 'projected from last 30 days', '')}
  </div>

  <div class="card">
    <div class="section-head"><h3 style="margin:0">Last 12 months</h3></div>
    ${barChart(series)}
    <div class="legend">
      <span><i style="background:var(--accent)"></i> Income</span>
      <span><i style="background:var(--danger)"></i> Expenses</span>
    </div>
  </div>

  <div class="grid g2" style="margin-top:.75rem">
    <div class="card">
      <h3>Account balances</h3>
      ${balances.map(b => `<div class="kv"><span>${esc(b.name)}</span><span class="${b.bal>=0?'':'neg'}">${fmtMoney(b.bal)}</span></div>`).join('')}
      <div class="kv" style="border-top:1px solid var(--border);margin-top:.25rem;padding-top:.6rem;font-weight:600">
        <span>Total</span><span>${fmtMoney(totalBalance())}</span>
      </div>
    </div>
    <div class="card">
      <h3>All-time summary</h3>
      <div class="kv"><span>Total income</span><span class="pos">${fmtMoney(allTime.totalIncome)}</span></div>
      <div class="kv"><span>Total expenses</span><span class="neg">${fmtMoney(allTime.totalExpenses)}</span></div>
      <div class="kv"><span>Net</span><span class="${allTime.net>=0?'pos':'neg'}">${fmtMoney(allTime.net)}</span></div>

/* ============================================================
   CHART
   ============================================================ */
function barChart(series){
  const W = 720, H = 240, PL = 52, PR = 12, PT = 16, PB = 36;
  const iw = W - PL - PR, ih = H - PT - PB;
  const max = Math.max(1, ...series.map(s => Math.max(s.income, s.expenses)));
  const bw = iw / series.length;
  const half = Math.min(bw * 0.32, 18);

  let grid = '';
  for(let g = 0; g <= 4; g++){
    const y = PT + ih - (g/4) * ih;
    grid += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    grid += `<text x="${PL-6}" y="${y+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${fmtMoney0(max*g/4)}</text>`;
  }

  let bars = '';
  series.forEach((s, i) => {
    const x = PL + i * bw + bw/2;
    const ihh = (s.income   / max) * ih;
    const ehh = (s.expenses / max) * ih;
    if(ihh > 0) bars += `<rect x="${x-half-1}" y="${PT+ih-ihh}" width="${half}" height="${ihh}" fill="var(--accent)" rx="2"><title>${monthLabelOf(s.key)} income: ${fmtMoney(s.income)}</title></rect>`;
    if(ehh > 0) bars += `<rect x="${x+1}" y="${PT+ih-ehh}" width="${half}" height="${ehh}" fill="var(--danger)" rx="2"><title>${monthLabelOf(s.key)} expenses: ${fmtMoney(s.expenses)}</title></rect>`;
    bars += `<text x="${x}" y="${H-14}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${monthLabelOf(s.key).split(' ')[0]}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet">${grid}${bars}</svg>`;
}

function reportRangeDates(){
  const now = new Date();
  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const mode = reportRange.mode;
  let from, to = todayISO(), label = '';

  if(mode === 'month'){
    from = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
    label = 'This month';
  } else if(mode === '30d'){
    const d = new Date(); d.setDate(d.getDate()-29); from = iso(d);
    label = 'Last 30 days';
  } else if(mode === '90d'){
    const d = new Date(); d.setDate(d.getDate()-89); from = iso(d);
    label = 'Last 90 days';
  } else if(mode === 'ytd'){
    from = `${now.getFullYear()}-01-01`;
    label = 'Year to date';
  } else if(mode === 'year'){
    const d = new Date(); d.setFullYear(d.getFullYear()-1); d.setDate(d.getDate()+1); from = iso(d);
    label = 'Last 12 months';
  } else {
    const all = state.incomes.concat(state.expenses).map(x => x.date).sort();
    from = all[0] || todayISO();
    label = 'All time';
  }
  if(from > to) from = to;
  return { from, to, label };
}

/* ============================================================
   FILE HANDLING — BACKUP & RESTORE
   ============================================================ */
let backupFileHandle = null;

function backupFilename(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `finance-backup-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
}

async function saveBackupFile(opts){
  opts = opts || {};
  const data = JSON.stringify(state, null, 2);
  const name = backupFilename();

  // Preferred: File System Access API — remembers the folder, one-click thereafter.
  if(window.showSaveFilePicker && (opts.pickFolder || !backupFileHandle)){
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: name,
        types: [{ description:'Finance backup', accept:{ 'application/json': ['.json'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(data);
      await writable.close();
      backupFileHandle = handle;
      markBackedUp();
      toast('Backup saved', 'ok');
      return;
    } catch(err){
      if(err && err.name === 'AbortError') return;
      // fall through to download
    }
  } else if(window.showSaveFilePicker && backupFileHandle){
    try {
      const writable = await backupFileHandle.createWritable();
      await writable.write(data);
      await writable.close();
      markBackedUp();
      toast('Backup updated in saved folder', 'ok');
      return;
    } catch(err){
      backupFileHandle = null;
      // fall through
    }
  }

  // Fallback: trigger a normal download.
  downloadBlob(new Blob([data], {type:'application/json'}), name);
  markBackedUp();
  toast('Backup downloaded — move it to your Drive folder', 'ok');
}

function markBackedUp(){
  state.lastBackupAt = new Date().toISOString();
  save();
  renderBackupBanner();
  if(currentView === 'data') render();
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function handleFileInput(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== 'object' || (!parsed.incomes && !parsed.expenses && !parsed.settings)){
        throw new Error('Not a valid finance backup file');
      }
      if(!confirm(`Restore from "${file.name}"?\n\nThis will replace everything currently in the app.`)) return;
      state = migrate(parsed);
      save(); render();
      toast('Data restored from backup', 'ok');
    } catch(err){
      alert('Could not restore: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function renderBackupBanner(){
  const el = $('#backupBanner');
  const days = num(state.settings.backupReminderDays);
  if(days <= 0){ el.classList.add('hidden'); return; }
  if(!state.lastBackupAt){
    const hasData = state.incomes.length + state.expenses.length > 0;
    if(!hasData){ el.classList.add('hidden'); return; }
    el.innerHTML = `<span>⚠ You have not backed up yet. Your data lives only in this browser.</span>
                    <button class="btn btn-sm btn-primary" id="bannerBackup">Back up now</button>`;
    el.classList.remove('hidden');
    $('#bannerBackup').onclick = () => saveBackupFile();
    return;
  }
  const ageDays = (Date.now() - new Date(state.lastBackupAt).getTime()) / 86400000;
  if(ageDays >= days){
    el.innerHTML = `<span>⚠ Last backup was ${Math.floor(ageDays)} days ago. Time for a fresh one.</span>
                    <button class="btn btn-sm btn-primary" id="bannerBackup">Back up now</button>`;
    el.classList.remove('hidden');
    $('#bannerBackup').onclick = () => saveBackupFile();
  } else {
    el.classList.add('hidden');
  }
}

/* ============================================================
   CSV EXPORTS
   ============================================================ */
function csvEscape(v){
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function toCSV(headers, rows){
  return [headers.join(',')].concat(rows.map(r => r.map(csvEscape).join(','))).join('\n');
}

function exportIncomeCSV(){
  const rows = state.incomes.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const csv = toCSV(
    ['Date','Source','Pay type','Quantity','Rate','Hours','Amount','Account','Notes'],
    rows.map(i => [i.date, i.source, payTypeLabel(i.payType), i.quantity||'', i.rate||'', i.hours||'', num(i.amount).toFixed(2), i.account||'', i.notes||''])
  );
  downloadBlob(new Blob([csv],{type:'text/csv'}), `income-${todayISO()}.csv`);
}

function exportExpensesCSV(){
  const rows = state.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const csv = toCSV(
    ['Date','Category','Description','Amount','Account','Essential','Notes'],
    rows.map(e => [e.date, e.category, e.description||'', num(e.amount).toFixed(2), e.account||'', e.essential?'Yes':'No', e.notes||''])
  );
  downloadBlob(new Blob([csv],{type:'text/csv'}), `expenses-${todayISO()}.csv`);
}

function exportMonthlyCSV(){
  const rows = lastNMonths(36).reverse().map(monthTotals).filter(r => r.count>0 || r.income>0 || r.expenses>0);
  const csv = toCSV(
    ['Month','Income','Expenses','Net','Hours','Per hour','Work days'],
    rows.map(r => [monthLabelOf(r.key), r.income.toFixed(2), r.expenses.toFixed(2), r.net.toFixed(2), r.hours.toFixed(2), r.perHour.toFixed(2), r.workDays])
  );
  downloadBlob(new Blob([csv],{type:'text/csv'}), `monthly-summary-${todayISO()}.csv`);
}

   ============================================================ */
function applySettings(){
  const cur = $('#setCurrency').value.trim() || '£';
  const hours = num($('#setHours').value) || 8;
  const baseline = num($('#setBaseline').value);
  const reminder = Math.max(0, Math.round(num($('#setReminder').value)));
  const accounts = $('#setAccounts').value.split(',').map(s => s.trim()).filter(Boolean);
  const incSrc = $('#setIncSrc').value.split(',').map(s => s.trim()).filter(Boolean);
  const expCat = $('#setExpCat').value.split(',').map(s => s.trim()).filter(Boolean);
  const essCat = $('#setEssCat').value.split(',').map(s => s.trim()).filter(Boolean);

  if(accounts.length === 0){ alert('You need at least one account.'); return; }

  // Handle opening balances and account renames gracefully
  const newOpen = {};
  accounts.forEach(a => {
    const el = document.querySelector(`[data-open="${CSS.escape(a)}"]`);
    newOpen[a] = el ? num(el.value) : num(state.openingBalances[a]);
  });

  state.currency = cur;
  state.settings.hoursPerDay = hours;
  state.settings.baselineMonthly = baseline;
  state.settings.backupReminderDays = reminder;
  state.settings.accounts = accounts;
  state.settings.incomeSources = incSrc;
  state.settings.expenseCategories = expCat;
  state.settings.essentialCategories = essCat;
  state.openingBalances = newOpen;

  save(); render(); toast('Settings saved', 'ok');
}

function modalShell(title, bodyHTML, footHTML){
  const root = $('#modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2>${esc(title)}</h2>
          <button class="icon-btn" id="modalClose" title="Close">✕</button>
        </div>
        ${bodyHTML}
        <div class="modal-foot">${footHTML}</div>
      </div>
    </div>`;
  const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); };
  const onKey = e => { if(e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  $('#modalClose').onclick = close;
  $('#overlay').onclick = e => { if(e.target.id === 'overlay') close(); };
  return close;
}

    <button class="btn" id="iCancel">Cancel</button>
    <button class="btn btn-primary" id="iSave">${editing?'Save changes':'Add income'}</button>
  `;

  const close = modalShell(editing ? 'Edit income' : 'Add income', body, foot);

  const typeSel = $('#iType');
  const qtyEl = $('#iQty'), rateEl = $('#iRate'), hoursEl = $('#iHours'), amtEl = $('#iAmount');

  function syncLabels(){
    const t = PAY_TYPES.find(p => p.id === typeSel.value) || PAY_TYPES[0];
    $('#iQtyLabel').textContent = t.qtyLabel;
    $('#iRateLabel').textContent = t.rateLabel;
  }

  function autoCalc(){
    const t = PAY_TYPES.find(p => p.id === typeSel.value) || PAY_TYPES[0];
    const q = qtyEl.value === '' ? NaN : num(qtyEl.value);
    const r = rateEl.value === '' ? NaN : num(rateEl.value);

    if(!isNaN(q) && !isNaN(r)){
      amtEl.value = (q * r).toFixed(2);
    }
    if(t.hoursMode === 'direct' && !isNaN(q)){
      hoursEl.value = q;
    } else if(t.hoursMode === 'derive' && !isNaN(q) && (!hoursEl.value || hoursEl.dataset.auto === '1')){
      hoursEl.value = (q * num(state.settings.hoursPerDay)).toFixed(2);
      hoursEl.dataset.auto = '1';
    }
    updateHint();
  }

  function updateHint(){
    const amt = num(amtEl.value);
    const h = num(hoursEl.value);
    const q = num(qtyEl.value);
    const parts = [];
    if(h > 0 && amt > 0) parts.push(`Effective: ${fmtMoney(amt/h)} per hour`);
    if(q > 0 && amt > 0) parts.push(`${fmtMoney(amt/q)} per ${(PAY_TYPES.find(p=>p.id===typeSel.value)||PAY_TYPES[0]).qtyLabel.toLowerCase().replace(/s$/,'')}`);
    $('#iHint').textContent = parts.join(' · ');
  }

  typeSel.onchange = () => { syncLabels(); autoCalc(); };
  [qtyEl, rateEl].forEach(el => el.oninput = autoCalc);
  hoursEl.oninput = () => { hoursEl.dataset.auto = '0'; updateHint(); };
  amtEl.oninput = updateHint;

  syncLabels();
  if(!editing) updateHint(); else updateHint();

  if(editing){
    $('#iDelete').onclick = () => {
      if(!confirm('Delete this income entry?')) return;
      state.incomes = state.incomes.filter(x => x.id !== id);
      save(); close(); render(); toast('Income deleted');
    };
  }

  $('#iCancel').onclick = close;
  $('#iSave').onclick = () => {
    const date = $('#iDate').value;
    if(!date){ alert('Please pick a date.'); return; }
    const amount = num(amtEl.value);
    if(amount <= 0){ alert('Amount must be greater than zero.'); return; }

    const rec = {
      id: editing ? id : uid(),
      createdAt: editing ? editing.createdAt : new Date().toISOString(),
      date,
      source: $('#iSource').value.trim(),
      payType: typeSel.value,
      quantity: qtyEl.value === '' ? '' : num(qtyEl.value),
      rate: rateEl.value === '' ? '' : num(rateEl.value),
      hours: hoursEl.value === '' ? '' : num(hoursEl.value),
      amount,
      account: $('#iAccount').value,
      notes: $('#iNotes').value.trim()
    };

    if(editing){
      const idx = state.incomes.findIndex(x => x.id === id);
      state.incomes[idx] = rec;
    } else {
      state.incomes.push(rec);
    }
    save(); close(); render(); toast(editing ? 'Income updated' : 'Income added', 'ok');
  };
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  const had = load();
  if(!had){
    // First run — start empty but with sensible defaults
    state = defaultState();
    save();
  }

  // Tabs
  $$('#tabs .tab').forEach(t => t.onclick = () => setView(t.dataset.view));

  // Quick backup button
  $('#btnQuickBackup').onclick = () => saveBackupFile();

  // Warn before leaving with unsaved changes? We auto-save, so instead warn about no backup.
  window.addEventListener('beforeunload', e => {
    if(!state.lastBackupAt && (state.incomes.length + state.expenses.length) > 5){
      e.preventDefault();
      e.returnValue = '';
    }
  });

  render();

  // Service worker
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}

document.addEventListener('DOMContentLoaded', init);
})();
</script>
