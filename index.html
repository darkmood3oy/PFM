<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Finance</title>
<meta name="theme-color" content="#ffffff"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2310b981'/><text x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='-apple-system,sans-serif' font-weight='700'>£</text></svg>"/>
<style>
/* ============================================================
   Design tokens
   ============================================================ */
:root{
  --bg:#f7f8fa;
  --card:#ffffff;
  --border:#e6e8ee;
  --border-strong:#d4d9e1;
  --text:#111827;
  --text-2:#667085;
  --text-3:#98a2b3;
  --accent:#10b981;
  --accent-strong:#059669;
  --accent-soft:#ecfdf5;
  --accent-ring:rgba(16,185,129,.16);
  --danger:#ef4444;
  --danger-soft:#fef2f2;
  --warn:#f59e0b;
  --warn-soft:#fffbeb;
  --r-sm:8px;--r:12px;--r-lg:16px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 4px 12px rgba(16,24,40,.06);
  --header-h:56px;
  --nav-h:60px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5;color:var(--text);background:var(--bg);
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
@media(min-width:768px){ body{padding-bottom:0} }
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.3}
h2{font-size:18px}h3{font-size:15px}
p{margin:0}
button{font-family:inherit}
a{color:var(--accent-strong);text-decoration:none}
.hidden{display:none !important}
.num,.value{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--text-2)}
.subtle{color:var(--text-3)}
.small{font-size:12.5px}
.nowrap{white-space:nowrap}
.strong{font-weight:600}

/* ------------------------------------------------------------
   Header
   ------------------------------------------------------------ */
.app-header{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);
  backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:980px;margin:0 auto;height:var(--header-h);padding:0 16px;
  padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
@media(min-width:768px){ .header-inner{padding:0 24px} }
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-.01em}
.brand-mark{
  width:26px;height:26px;border-radius:8px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;
}
.header-actions{display:flex;align-items:center;gap:6px}
.icon-btn{
  width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;
  border:none;background:transparent;border-radius:10px;color:var(--text-2);cursor:pointer;
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--border);color:var(--text)}
.icon-btn:active{background:var(--border-strong)}
.icon-btn svg{width:20px;height:20px;stroke-width:1.8}
.sync-dot{
  width:9px;height:9px;border-radius:50%;display:inline-block;
  background:var(--text-3);border:1.5px solid #fff;box-shadow:0 0 0 1px var(--border);
}
.sync-dot.ok{background:var(--accent)}
.sync-dot.off{background:var(--warn)}

/* ------------------------------------------------------------
   Backup banner
   ------------------------------------------------------------ */
.banner{
  background:var(--warn-soft);border-bottom:1px solid #fde68a;color:#92400e;
  font-size:13.5px;line-height:1.4;
}
.banner-inner{
  max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}

/* ------------------------------------------------------------
   Navigation
   ------------------------------------------------------------ */
.nav-desktop{position:sticky;top:var(--header-h);z-index:40;background:var(--card);border-bottom:1px solid var(--border)}
.nav-inner{max-width:980px;margin:0 auto;display:flex;gap:4px;padding:6px 16px}
@media(min-width:768px){ .nav-inner{padding:6px 24px} }
.nav-mobile{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
  border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);
  display:flex;justify-content:space-around;align-items:center;
}
.tab{
  font-family:inherit;font-size:14px;font-weight:500;color:var(--text-2);
  background:transparent;border:none;padding:8px 14px;border-radius:10px;cursor:pointer;
}
.tab:hover{background:var(--border);color:var(--text)}
.tab.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.nav-mobile .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 0;font-size:11px;min-width:0;color:var(--text-2);background:transparent;border:none;
}
.nav-mobile .tab svg{width:22px;height:22px;stroke-width:1.8;stroke:currentColor;fill:none}
.nav-mobile .tab.active{color:var(--accent-strong)}

/* ------------------------------------------------------------
   Sections & cards
   ------------------------------------------------------------ */
.app-main{max-width:980px;margin:0 auto;padding:16px 16px 0}
@media(min-width:768px){ .app-main{padding:24px 24px 40px} }
.section{margin-bottom:22px}
.section-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.section-title{font-size:15px;font-weight:600;color:var(--text)}
.section-sub{font-size:13px;color:var(--text-2);margin-top:2px}
.page-title{font-size:22px;letter-spacing:-.02em;font-weight:600;margin:0}
.page-sub{font-size:13px;color:var(--text-2);margin-top:2px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow-sm);padding:16px;
}
.card + .card{margin-top:12px}
.card-pad{padding:12px}
.card-flush{padding:0;overflow:hidden}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;
}
.stat .k{font-size:12.5px;color:var(--text-2);font-weight:500}
.stat .v{font-size:20px;font-weight:650;letter-spacing:-.01em;margin-top:2px}
.stat .s{font-size:12px;color:var(--text-3);margin-top:2px}
.pos{color:var(--accent-strong)}
.neg{color:var(--danger)}

/* ------------------------------------------------------------
   Buttons
   ------------------------------------------------------------ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:40px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:550;
  font-family:inherit;background:var(--card);border:1px solid var(--border-strong);color:var(--text);
  box-shadow:var(--shadow-sm);cursor:pointer;transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--border);border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px;stroke-width:2}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--border)}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn-sm svg{width:15px;height:15px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.flex{display:flex;align-items:center;gap:8px}
.flex-wrap{flex-wrap:wrap}
.flex-right{margin-left:auto}
.spacer{flex:1}

/* ------------------------------------------------------------
   Forms
   ------------------------------------------------------------ */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field > label{font-size:13px;font-weight:500;color:var(--text)}
.row{display:grid;gap:10px}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:1fr 1fr 1fr}
.row .field{margin-bottom:0}
input,select,textarea{
  width:100%;font:inherit;padding:10px 12px;border:1px solid var(--border-strong);
  border-radius:var(--r-sm);background:var(--card);color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
input[type=checkbox]{width:auto;height:auto;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text)}
.label-hint{font-size:12px;color:var(--text-3);font-weight:400}
.chip{
  display:inline-flex;align-items:center;font-size:12px;padding:2px 9px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent-strong);font-weight:500;
}
.chip.warn{background:var(--warn-soft);color:#b45309}
.chip.plain{background:var(--border);color:var(--text-2)}

/* ------------------------------------------------------------
   Lists & tables
   ------------------------------------------------------------ */
.listitem{
  display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;
  transition:background .12s,border-color .12s;
}
.listitem + .listitem{margin-top:8px}
.listitem:hover{background:#fbfbfd;border-color:var(--border-strong)}
.listitem:active{background:var(--border)}
.li-main{flex:1;min-width:0}
.li-title{font-size:14.5px;font-weight:550;color:var(--text)}
.li-sub{font-size:12.5px;color:var(--text-2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-side{font-size:15px;font-weight:650}
.chev{color:var(--text-3);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--text-2);font-weight:550;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fbfbfd}
.emptynote{
  text-align:center;color:var(--text-2);font-size:13.5px;padding:26px 12px;
  background:var(--card);border:1px dashed var(--border-strong);border-radius:var(--r);
}

/* ------------------------------------------------------------
   Modal
   ------------------------------------------------------------ */
.modal-overlay{
  position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.35);
  display:flex;align-items:flex-end;justify-content:center;
}
@media(min-width:640px){ .modal-overlay{align-items:center} }
.modal{
  width:100%;max-width:480px;max-height:92vh;overflow:auto;
  background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  padding:18px;margin:0 12px 12px;
}
@media(min-width:640px){ .modal{margin:0} }
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.modal-head h2{font-size:17px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.modal-foot .btn-danger{margin-right:auto}

/* ------------------------------------------------------------
   Reports & charts
   ------------------------------------------------------------ */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding:6px 0}
.bar{flex:1;background:var(--accent);border-radius:4px 4px 2px 2px;transition:background .15s}
.bar.neg{background:var(--danger)}
.bar-chart .bar:hover{background:var(--accent-strong)}
.chart-x{display:flex;gap:6px;font-size:10.5px;color:var(--text-3);text-align:center}
.chart-x span{flex:1;overflow:hidden;text-overflow:ellipsis}

/* ------------------------------------------------------------
   Toast
   ------------------------------------------------------------ */
#toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px);transform:translateX(-50%);
  z-index:90;background:var(--text);color:#fff;font-size:13.5px;font-weight:550;
  padding:10px 18px;border-radius:12px;box-shadow:var(--shadow-lg);opacity:0;
  transition:opacity .25s,transform .25s;max-width:88vw;text-align:center;pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
#toast.ok{background:var(--accent-strong)}
#toast.err{background:var(--danger)}

/* print */
@media print{ .nav-mobile,.nav-desktop,.app-header,.banner{display:none} body{padding:0} }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

<div id="backupBanner" class="banner hidden"></div>

<nav class="nav-desktop">

<script>
(function(){
'use strict';

/* ============================================================
   CONSTANTS & STATE
   ============================================================ */
const STORAGE_KEY = 'finance.v2';
const KEY_PASS    = 'finance.pass.v2';
const KEY_SYNC    = 'finance.sync.v2';
const SYNC_ROW    = 'primary';

const PAY_TYPES = [
  {id:'hourly',  label:'Hourly',  qtyLabel:'Hours',  rateLabel:'Rate per hour',  hoursMode:'direct'},
  {id:'daily',   label:'Daily',   qtyLabel:'Days',   rateLabel:'Rate per day',   hoursMode:'derive'},
  {id:'weekly',  label:'Weekly',  qtyLabel:'Weeks',  rateLabel:'Rate per week',  hoursMode:'manual'},
  {id:'monthly', label:'Monthly', qtyLabel:'Months', rateLabel:'Rate per month', hoursMode:'manual'},
  {id:'lump',    label:'One-off', qtyLabel:'Qty',    rateLabel:'Rate',           hoursMode:'manual'}
];

const MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ============================================================
   PURE CORE  (unit-tested separately — see _tests/)
   ============================================================ */
/*==TESTABLE==start==*/
const ITERATIONS = 200000;

function defaultState(){
  return {
    version:2,
    currency:'£',
    createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString(),
    lastBackupAt:null,
    settings:{
      hoursPerDay:8,
      baselineMonthly:0,
      backupReminderDays:7,
      accounts:['Holding','Operating','Savings'],
      incomeSources:['Client A','Client B','Employer','Gig','Other'],
      expenseCategories:[
        'Rent/Mortgage','Utilities','Groceries','Transport','Insurance',
        'Debt Payment','Healthcare','Dining','Entertainment','Shopping',
        'Subscriptions','Car Maintenance','Gifts','Household','Other'
      ],
      essentialCategories:[
        'Rent/Mortgage','Utilities','Groceries','Transport',
        'Insurance','Debt Payment','Healthcare'
      ]
    },
    openingBalances:{Holding:0,Operating:0,Savings:0},
    incomes:[], expenses:[], transfers:[]
  };
}
function migrate(data){
  if(!data || typeof data!=='object') return defaultState();
  const base = defaultState();
  const out = Object.assign({}, base, data);
  out.settings = Object.assign({}, base.settings, data.settings||{});
  out.openingBalances = Object.assign({}, base.openingBalances, data.openingBalances||{});
  (out.settings.accounts||[]).forEach(a=>{ if(typeof out.openingBalances[a]!=='number') out.openingBalances[a]=0; });
  out.incomes  = Array.isArray(data.incomes)  ? data.incomes  : [];
  out.expenses = Array.isArray(data.expenses) ? data.expenses : [];
  out.transfers= Array.isArray(data.transfers)? data.transfers: [];
  return out;
}
function b64enc(bytes){
  const u = new Uint8Array(bytes);
  let s='';
  for(let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, Array.from(u.subarray(i,i+0x8000)));
  return btoa(s);
}
function b64dec(s){
  const bin = atob(s);
  const u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u;
}
async function deriveKey(pass, saltB64, iters){
  const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', iterations:iters||ITERATIONS, salt:b64dec(saltB64)}, raw, 256);
}
async function encryptJSON(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const bits = await deriveKey(pass, b64enc(salt));
  const aes  = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['encrypt']);
  const ct   = await crypto.subtle.encrypt({name:'AES-GCM', iv}, aes, new TextEncoder().encode(JSON.stringify(obj)));
  return {enc:'AES-256-GCM', v:1, iter:ITERATIONS, salt:b64enc(salt), iv:b64enc(iv), ct:b64enc(ct)};
}
async function decryptJSON(env, pass){
  const bits = await deriveKey(pass, env.salt, env.iter||ITERATIONS);
  const aes  = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
  const pt   = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64dec(env.iv)}, aes, b64dec(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function isEnvelope(obj){
  return !!(obj && typeof obj==='object' && obj.enc==='AES-256-GCM' && obj.ct && obj.salt && obj.iv);
}
/*==TESTABLE==end==*/

let state = defaultState();

/* ============================================================
   UTILS
   ============================================================ */
const $  = (s,r)=>(r||document).querySelector(s);
const $$ = (s,r)=>Array.from((r||document).querySelectorAll(s));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

function save(){
  state.updatedAt = new Date().toISOString();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ toast('Cannot save. Back up to a file now!','err'); }
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    state = migrate(JSON.parse(raw));
    return true;
  }catch(e){ return false; }
}

/* ============================================================
   METRICS
   ============================================================ */
function accountBalances(){
  const b = Object.assign({}, state.openingBalances);
  state.incomes.forEach(i=>{ if(b[i.account]!==undefined) b[i.account] += num(i.amount); });
  state.expenses.forEach(e=>{ if(b[e.account]!==undefined) b[e.account] -= num(e.amount); });
  state.transfers.forEach(t=>{
    if(b[t.from]!==undefined) b[t.from] -= num(t.amount);
    if(b[t.to]!==undefined)   b[t.to]   += num(t.amount);
  });
  return b;
}
function monthTotals(key){
  const incs = state.incomes.filter(i=>monthKeyOf(i.date)===key);
  const exps = state.expenses.filter(e=>monthKeyOf(e.date)===key);
  const income   = incs.reduce((s,i)=>s+num(i.amount),0);
  const expenses = exps.reduce((s,e)=>s+num(e.amount),0);
  const hours    = incs.reduce((s,i)=>s+num(i.hours),0);
  const workDays = new Set(incs.map(i=>i.date)).size;
  return {key, income, expenses, net:income-expenses, hours, workDays, perHour: hours>0 ? income/hours : 0};
}
function lastNMonths(n){
  const out=[]; const now=new Date();
  let y=now.getFullYear(), m=now.getMonth();
  for(let i=0;i<n;i++){
    out.push(`${y}-${String(m+1).padStart(2,'0')}`);
    m--; if(m<0){ m=11; y--; }
  }
  return out.slice().reverse();
}
function normalisedEarnings(){
  const months = lastNMonths(3).map(monthTotals);
  const inc    = months.reduce((s,m)=>s+m.income,0);
  const hours  = months.reduce((s,m)=>s+m.hours,0);
  const days   = new Set(state.incomes.filter(i=>i.date>=lastNMonths(3)[2]).map(i=>i.date)).size;
  const perHour = hours>0 ? inc/hours : 0;
  const perDay  = days>0  ? inc/days  : 0;
  return {
    perHour,
    perDay,
    perWeek: perDay*7,
    perMonth: inc/3,
    perYear: inc*4
  };
}

function modalShell(title, bodyHTML, footHTML){
  const root = $('#modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2>${esc(title)}</h2>
          <button class="icon-btn" id="modalClose" title="Close" aria-label="Close">✕</button>
        </div>
        <div class="modal-body">${bodyHTML}</div>
        <div class="modal-foot">${footHTML}</div>
      </div>
    </div>`;
  const onKey = e=>{ if(e.key==='Escape') close(); };
  const close = ()=>{ root.innerHTML=''; document.removeEventListener('keydown', onKey); };
  document.addEventListener('keydown', onKey);
  $('#modalClose').onclick = close;
  $('#overlay').onclick = e=>{ if(e.target.id==='overlay') close(); };
  return close;
}

/* ============================================================
   PASSPHRASE
   ============================================================ */
let sessionPass = null;
function passphrasePrompt(title, okLabel, create){
  return new Promise(resolve=>{
    const body =
      (create
        ? '<div class="field"><label>New passphrase</label><input type="password" id="pp1" autocomplete="new-password" placeholder="At least 8 characters"></div>' +
          '<div class="field"><label>Repeat passphrase</label><input type="password" id="pp2" autocomplete="new-password"></div>' +
          '<p class="muted small">This passphrase encrypts your data before it leaves this device. There is no way to recover it — keep it safe in a password manager.</p>'
        : '<div class="field"><label>Passphrase</label><input type="password" id="pp1" autocomplete="current-password" placeholder="Your passphrase"></div>' +
          '<p class="muted small">Used to decrypt the data. It never leaves this device.</p>') +
      '<div class="check" style="margin-top:6px"><input type="checkbox" id="ppRemember" checked> Remember on this device</div>' +
      '<p class="subtle small">Remembering saves it in this browser, so anyone with access to this device could read it. Recommended only on your own phone or laptop.</p>';
    const foot = '<button class="btn" id="ppCancel">Cancel</button><button class="btn btn-primary" id="ppOk">' + esc(okLabel) + '</button>';
    const close = modalShell(title, body, foot);
    $('#ppOk').onclick = ()=>{
      const p1 = $('#pp1').value;
      if(!p1){ alert('Enter a passphrase.'); return; }
      if(create){
        if(p1.length<8){ alert('Use at least 8 characters.'); return; }
        if(p1!==$('#pp2').value){ alert('Passphrases do not match.'); return; }
      }
      resolve({pass:p1, remember:$('#ppRemember').checked});
      close();
    };
    $('#ppCancel').onclick = ()=>{ resolve(null); close(); };
  });
}
async function getPassphrase(mode){
  if(sessionPass) return sessionPass;
  if(mode==='use'){
    const remembered = localStorage.getItem(KEY_PASS);
    if(remembered){ sessionPass = remembered; return sessionPass; }
  }
  const r = await passphrasePrompt(
    mode==='create' ? 'Create your passphrase' : 'Enter your passphrase',
    mode==='create' ? 'Set passphrase' : 'Unlock', mode==='create');
  if(!r) return null;
  if(r.remember) localStorage.setItem(KEY_PASS, r.pass);
  else localStorage.removeItem(KEY_PASS);
  sessionPass = r.pass;
  return sessionPass;
}
function forgetPassphrase(){
  sessionPass = null;
  localStorage.removeItem(KEY_PASS);
}
function hasPassphrase(){ return !!(sessionPass || localStorage.getItem(KEY_PASS)); }

/* ============================================================
   CLOUD SYNC (Supabase)
   ============================================================ */
let syncCfg = null;
let syncBusy = false;
const tsOf = v => { const t = Date.parse(v); return isNaN(t) ? 0 : t; };
function loadSyncCfg(){
  try{ syncCfg = JSON.parse(localStorage.getItem(KEY_SYNC)||'null'); }
  catch(e){ syncCfg = null; }
  if(!syncCfg || typeof syncCfg!=='object') syncCfg = null;
}
function saveSyncCfg(){ localStorage.setItem(KEY_SYNC, JSON.stringify(syncCfg)); }
function syncConfigured(){
  return !!syncCfg && !!syncCfg.url && !!syncCfg.anonKey && !!syncCfg.email && !!syncCfg.password;
}
function sbUrl(path){ return syncCfg.url.replace(/\/+$/,'') + path; }
async function sbJson(path, method, bodyObj, opts){
  opts = opts || {};
  const headers = {apikey: syncCfg.anonKey, 'Content-Type':'application/json'};
  Object.assign(headers, opts.headers||{});
  const req = {method: method, headers: headers};
  if(bodyObj !== undefined) req.body = JSON.stringify(bodyObj);
  let res;
  try{ res = await fetch(sbUrl(path), req); }
  catch(e){ throw new Error('Cannot reach Supabase. Check your connection and project URL.'); }
  if(!res.ok){
    let msg = 'HTTP '+res.status;
    try{ const j = await res.json(); msg = j.message || j.error_description || j.msg || msg; }catch(e){}
    throw new Error(msg);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
async function sbEnsureToken(){
  if(syncCfg.token && syncCfg.token.expiresAt && syncCfg.token.expiresAt > Date.now()+60000)
    return syncCfg.token.access;
  if(syncCfg.token && syncCfg.token.refresh){
    try{
      const j = await sbJson('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:syncCfg.token.refresh});
      syncCfg.token = {access:j.access_token, refresh:j.refresh_token, expiresAt: Date.now()+j.expires_in*1000};
      saveSyncCfg();
      return j.access_token;
    }catch(e){ syncCfg.token = null; saveSyncCfg(); }
  }
  const j = await sbJson('/auth/v1/token?grant_type=password','POST',{email:syncCfg.email, password:syncCfg.password});
  syncCfg.token = {access:j.access_token, refresh:j.refresh_token, expiresAt: Date.now()+j.expires_in*1000};
  if(j.user && j.user.id) syncCfg.userId = j.user.id;
  saveSyncCfg();
  return j.access_token;
}
async function sbFetchRow(){
  const token = await sbEnsureToken();
  const res = await fetch(sbUrl('/rest/v1/finance_sync?id=eq.'+SYNC_ROW+'&select=payload,updated_at'),
    {headers:{apikey:syncCfg.anonKey, 'Content-Type':'application/json', Authorization:'Bearer '+token}});
  if(!res.ok) throw new Error('Could not read the cloud (HTTP '+res.status+').');
  const rows = await res.json();
  return (rows && rows.length) ? rows[0] : null;
}
function renderSyncDot(){
  const dot = $('#headerSyncDot');
  if(syncConfigured()){
    dot.className = 'sync-dot ok';
    dot.title = 'Cloud sync ready';
  }else{
    dot.className = 'sync-dot';
    dot.title = 'Cloud sync: not configured — open Data → Cloud sync';
  }
}
async function syncPush(){
  if(!syncConfigured()){ toast('Set up cloud sync first (Data → Cloud sync)','err'); return; }
  if(syncBusy) return;
  syncBusy = true; updateSyncButtons();
  try{
    const pass = await getPassphrase('use');
    if(!pass) return;
    const remote = await sbFetchRow();
    if(remote && tsOf(remote.updated_at) > tsOf(state.updatedAt)){
      if(!confirm('The cloud already has NEWER data (pushed from another device).\n\nPushing now would overwrite it.\n\nContinue?')) return;
    }
    const envelope = await encryptJSON(state, pass);
    const token = await sbEnsureToken();
    if(!syncCfg.userId) throw new Error('Sign-in did not return a user id. Save sync settings again.');
    await sbJson('/rest/v1/finance_sync','POST',{
      id:SYNC_ROW,
      user_id:syncCfg.userId,
      payload:JSON.stringify(envelope),
      updated_at:new Date().toISOString()
    }, {headers:{Prefer:'resolution=merge-duplicates,return=minimal', Authorization:'Bearer '+token}});
    syncCfg.lastPushAt = new Date().toISOString();
    saveSyncCfg();
    renderSyncDot();
    toast('Pushed to cloud','ok');
  }catch(e){
    toast('Push failed: '+e.message,'err');
  }finally{
    syncBusy = false; updateSyncButtons();
    if(currentView==='data') render();
  }
}
async function syncPull(){
  if(!syncConfigured()){ toast('Set up cloud sync first (Data → Cloud sync)','err'); return; }
  if(syncBusy) return;
  syncBusy = true; updateSyncButtons();
  try{
    const row = await sbFetchRow();
    if(!row){ toast('Nothing on the cloud yet — push first','err'); return; }
    if(tsOf(row.updated_at) <= tsOf(state.updatedAt)){
      if(!confirm('The cloud copy is not newer than this device.\n\nLoad it anyway? Your local data would be replaced.')) return;
    }
    const pass = await getPassphrase('use');
    if(!pass) return;
    let remote;
    try{ remote = migrate(await decryptJSON(JSON.parse(row.payload), pass)); }
    catch(e){ throw new Error('Could not decrypt the cloud data — wrong passphrase or corrupted data'); }
    const localCount = state.incomes.length + state.expenses.length;
    const cloudCount = remote.incomes.length + remote.expenses.length;
    if(!confirm('Replace local data with the cloud copy?\n\nLocal: '+localCount+' entries · Cloud: '+cloudCount+' entries\n\nThis replaces everything on this device.')) return;
    state = remote;
    syncCfg.lastPullAt = new Date().toISOString();
    saveSyncCfg();
    save(); render(); renderSyncDot();
    toast('Pulled from cloud','ok');
  }catch(e){
    toast('Pull failed: '+e.message,'err');
  }finally{
    syncBusy = false; updateSyncButtons();
    if(currentView==='data') render();
  }
}
function updateSyncButtons(){
  const set = v=>{ const b=$('#btnSyncPush'); if(b) b.disabled=v; const c=$('#btnSyncPull'); if(c) c.disabled=v; };
  set(syncBusy);
}

/* ============================================================
   BACKUP & RESTORE
   ============================================================ */
let backupFileHandle = null;
function backupFilename(){
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  return `finance-backup-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
}
async function saveBackupFile(opts){
  opts = opts||{};
  let data, name = backupFilename();
  try{
    if(opts.encrypt){
      const pass = await getPassphrase('use');
      if(!pass) return;
      const env = await encryptJSON(state, pass);
      data = JSON.stringify(env,null,2);
    }else{
      data = JSON.stringify(state,null,2);
    }
  }catch(e){
    toast('Encryption failed: '+e.message,'err');
    return;
  }
  const write = async h=>{ const w = await h.createWritable(); await w.write(data); await w.close(); };
  if(window.showSaveFilePicker && (opts.pickFolder || !backupFileHandle)){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName:name,
        types:[{description:'Finance backup', accept:{'application/json':['.json']}}]
      });
      await write(handle);
      backupFileHandle = handle;
      markBackedUp();
      toast('Backup saved'+(opts.encrypt?' (encrypted)':''),'ok');
      return;
    }catch(err){ if(err&&err.name==='AbortError') return; }
  } else if(window.showSaveFilePicker && backupFileHandle){
    try{
      await write(backupFileHandle);
      markBackedUp();
      toast('Backup updated'+(opts.encrypt?' (encrypted)':''),'ok');
      return;
    }catch(err){ backupFileHandle = null; }
  }
  downloadBlob(new Blob([data],{type:'application/json'}), name);
  markBackedUp();
  toast('Backup downloaded'+(opts.encrypt?' (encrypted)':''),'ok');
}
function markBackedUp(){
  state.lastBackupAt = new Date().toISOString();
  save(); renderBackupBanner();
  if(currentView==='data') render();
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
async function handleFileInput(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  try{
    let parsed = JSON.parse(await file.text());
    if(isEnvelope(parsed)){
      const pass = await getPassphrase('use');
      if(!pass) return;
      try{ parsed = await decryptJSON(parsed, pass); }
      catch(err){ throw new Error('Could not decrypt — wrong passphrase or corrupted file'); }
    }
    if(!parsed || typeof parsed!=='object' || (!parsed.incomes && !parsed.expenses && !parsed.settings))
      throw new Error('Not a valid finance backup file');
    if(!confirm(`Restore from "${file.name}"?\n\nThis replaces everything currently in the app.`)) return;
    state = migrate(parsed);
    save(); render();
    toast('Data restored from backup','ok');
  }catch(err){
    alert('Could not restore: '+err.message);
  }
  e.target.value='';
}
function renderBackupBanner(){
  const el = $('#backupBanner');
  const days = num(state.settings.backupReminderDays);
  if(days<=0){ el.classList.add('hidden'); return; }
  if(state.incomes.length+state.expenses.length===0){ el.classList.add('hidden'); return; }
  const ageDays = state.lastBackupAt ? (Date.now()-new Date(state.lastBackupAt).getTime())/86400000 : Infinity;
  if(ageDays < days){ el.classList.add('hidden'); return; }
  const msg = !state.lastBackupAt
    ? 'You have not backed up yet. Your data lives only in this browser.'
    : 'Last backup was '+Math.floor(ageDays)+' days ago. Time for a fresh one.';
  el.innerHTML = '<div class="banner-inner"><span>'+esc(msg)+'</span><button class="btn btn-sm btn-primary" id="bannerBackup">Back up now</button></div>';
  el.classList.remove('hidden');
  $('#bannerBackup').onclick = ()=>saveBackupFile({encrypt:hasPassphrase()});
}

/* ============================================================
   CSV EXPORTS
   ============================================================ */
function csvEscape(v){ const s=String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function toCSV(headers, rows){ return [headers.join(',')].concat(rows.map(r=>r.map(csvEscape).join(','))).join('\n'); }
function exportIncomeCSV(){
  const rows = state.incomes.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const csv = toCSV(
    ['Date','Source','Pay type','Quantity','Rate','Hours','Amount','Account','Notes'],
    rows.map(i=>[i.date,i.source,payTypeLabel(i.payType),i.quantity||'',i.rate||'',i.hours||'',num(i.amount).toFixed(2),i.account||'',i.notes||'']));
  downloadBlob(new Blob([csv],{type:'text/csv'}), `income-${todayISO()}.csv`);
}
function exportExpensesCSV(){
  const rows = state.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const csv = toCSV(
    ['Date','Category','Description','Amount','Account','Essential','Notes'],
    rows.map(e=>[e.date,e.category,e.description||'',num(e.amount).toFixed(2),e.account||'',e.essential?'Yes':'No',e.notes||'']));
  downloadBlob(new Blob([csv],{type:'text/csv'}), `expenses-${todayISO()}.csv`);
}
function exportMonthlyCSV(){
  const rows = lastNMonths(36).map(monthTotals).filter(r=>r.income>0||r.expenses>0).reverse();
  const csv = toCSV(
    ['Month','Income','Expenses','Net','Hours','Per hour','Work days'],
    rows.map(r=>[monthLabelOf(r.key),r.income.toFixed(2),r.expenses.toFixed(2),r.net.toFixed(2),r.hours.toFixed(2),r.perHour.toFixed(2),r.workDays]));
  downloadBlob(new Blob([csv],{type:'text/csv'}), `monthly-summary-${todayISO()}.csv`);
}

function openTransferModal(){
  const accounts = state.settings.accounts;

  const body = `
    <div class="row c2">
      <div class="field"><label>From</label>

      <div class="field"><label>To</label>

    </div>
    <div class="field"><label>Note <span class="label-hint">optional</span></label><input id="tNote"></div>`;
  const foot = '<button class="btn" id="tCancel">Cancel</button><button class="btn btn-primary" id="tSave">Transfer</button>';
  const close = modalShell('Transfer between accounts', body, foot);
  $('#tCancel').onclick = close;
  $('#tSave').onclick = ()=>{
    const from = $('#tFrom').value, to = $('#tTo').value, amt = num($('#tAmount').value);
    if(amt<=0){ alert('Enter an amount greater than 0.'); return; }
    if(from===to){ alert('Choose two different accounts.'); return; }
    state.transfers.push({id:uid(), date:$('#tDate').value, from, to, amount:amt, note:$('#tNote').value.trim()});
    save(); close(); render();
    toast('Transfer recorded','ok');
  };
}

    </div>
    <div class="row c2">
      <div class="field"><label>Amount received</label><input type="number" step="0.01" min="0" id="iAmount" value="${it.amount}"></div>
      <div class="field"><label>Account</label>
        <select id="iAccount">${state.settings.accounts.map(a=>`<option ${it.account===a?'selected':''}>${esc(a)}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field"><label>Notes</label><input id="iNotes" value="${esc(it.notes||'')}"></div>
    <p class="muted small" id="iHint" style="min-height:16px"></p>
  `;
  const foot = (editing?'<button class="btn btn-danger" id="iDelete">Delete</button>':'') +
    '<button class="btn" id="iCancel">Cancel</button><button class="btn btn-primary" id="iSave">'+(editing?'Save changes':'Add income')+'</button>';
  const close = modalShell(editing?'Edit income':'Add income', body, foot);
  const typeSel=$('#iType'), qtyEl=$('#iQty'), rateEl=$('#iRate'), hoursEl=$('#iHours'), amtEl=$('#iAmount');
  function syncLabels(){
    const t = PAY_TYPES.find(p=>p.id===typeSel.value) || PAY_TYPES[0];
    $('#iQtyLabel').textContent = t.qtyLabel;
    $('#iRateLabel').textContent = t.rateLabel;
  }
  function autoCalc(){
    const t = PAY_TYPES.find(p=>p.id===typeSel.value) || PAY_TYPES[0];
    const qty = num(qtyEl.value), rate = num(rateEl.value);
    if(t.hoursMode==='direct'){ hoursEl.value = qty; }
    else if(t.hoursMode==='derive'){ const hpd = Math.max(num(state.settings.hoursPerDay),1); hoursEl.value = (qty*hpd)||''; }
    amtEl.value = (qty*rate)||'';
  }
  typeSel.onchange = ()=>{ syncLabels(); autoCalc(); };
  qtyEl.oninput = autoCalc;
  rateEl.oninput = autoCalc;
  $('#iCancel').onclick = close;
  $('#iDelete').onclick = ()=>{
    if(!confirm('Delete this income entry?')) return;
    state.incomes = state.incomes.filter(x=>x.id!==id);
    save(); close(); render(); toast('Income deleted','err');
  };
  $('#iSave').onclick = ()=>{
    const source = $('#iSource').value.trim();
    const date = $('#iDate').value;
    const amount = num(amtEl.value);
    if(!source){ alert('Enter a source.'); return; }
    if(amount<=0){ alert('Enter an amount greater than 0.'); return; }
    const entry = {
      id: editing ? id : uid(),
      date, source,
      payType: typeSel.value,
      quantity: num(qtyEl.value),
      rate: num(rateEl.value),
      hours: num(hoursEl.value),
      amount,
      account: $('#iAccount').value,
      notes: $('#iNotes').value.trim()
    };
    if(editing){ const i = state.incomes.findIndex(x=>x.id===id); state.incomes[i] = entry; }
    else state.incomes.push(entry);
    save(); close(); render(); toast(editing?'Income updated':'Income added','ok');
  };
  syncLabels();
}

/* ============================================================
   EXPENSE MODAL
   ============================================================ */
function openExpenseModal(id){
  const editing = id ? state.expenses.find(x=>x.id===id) : null;
  const defCat = state.settings.expenseCategories[0]||'';
  const it = editing || {id:null, date:todayISO(), category:defCat, description:'', amount:'', account:state.settings.accounts[0]||'', essential:state.settings.essentialCategories.includes(defCat), notes:''};
  const body = `
    <div class="row c2">
      <div class="field"><label>Date</label><input type="date" id="eDate" value="${it.date}"></div>
      <div class="field"><label>Category</label>
        <select id="eCategory">${state.settings.expenseCategories.map(c=>`<option ${it.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field"><label>Description <span class="label-hint">optional</span></label><input id="eDesc" value="${esc(it.description||'')}" placeholder="What was it?"></div>
    <div class="row c2">
      <div class="field"><label>Amount</label><input type="number" step="0.01" min="0" id="eAmount" value="${it.amount}"></div>
      <div class="field"><label>Account</label>
        <select id="eAccount">${state.settings.accounts.map(a=>`<option ${it.account===a?'selected':''}>${esc(a)}</option>`).join('')}</select>
      </div>
    </div>
    <div class="check" style="margin-bottom:6px"><input type="checkbox" id="eEssential" ${it.essential?'checked':''}> Essential expense</div>
    <div class="field"><label>Notes</label><input id="eNotes" value="${esc(it.notes||'')}"></div>
  `;
  const foot = (editing?'<button class="btn btn-danger" id="eDelete">Delete</button>':'') +
    '<button class="btn" id="eCancel">Cancel</button><button class="btn btn-primary" id="eSave">'+(editing?'Save changes':'Add expense')+'</button>';
  const close = modalShell(editing?'Edit expense':'Add expense', body, foot);
  $('#eCategory').onchange = ()=>{
    if(state.settings.essentialCategories.includes($('#eCategory').value)) $('#eEssential').checked = true;
  };
  $('#eCancel').onclick = close;
  $('#eDelete').onclick = ()=>{
    if(!confirm('Delete this expense?')) return;
    state.expenses = state.expenses.filter(x=>x.id!==id);
    save(); close(); render(); toast('Expense deleted','err');
  };
  $('#eSave').onclick = ()=>{
    const amount = num($('#eAmount').value);
    if(amount<=0){ alert('Enter an amount greater than 0.'); return; }
    const entry = {
      id: editing ? id : uid(),
      date: $('#eDate').value,
      category: $('#eCategory').value,
      description: $('#eDesc').value.trim(),
      amount,
      account: $('#eAccount').value,
      essential: $('#eEssential').checked,
      notes: $('#eNotes').value.trim()
    };
    if(editing){ const i = state.expenses.findIndex(x=>x.id===id); state.expenses[i] = entry; }
    else state.expenses.push(entry);
    save(); close(); render(); toast(editing?'Expense updated':'Expense added','ok');
  };
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  const had = load();
  if(!had){ state = defaultState(); save(); }
  loadSyncCfg();
  $$('.tab').forEach(t=>t.onclick=()=>setView(t.dataset.view));
  $('#btnQuickBackup').onclick = ()=>saveBackupFile({encrypt:hasPassphrase()});
  $('#btnData').onclick = ()=>setView('data');
  renderSyncDot();
  window.addEventListener('beforeunload', e=>{
    if(!state.lastBackupAt && (state.incomes.length+state.expenses.length)>5){
      e.preventDefault(); e.returnValue = '';
    }
  });
  render();
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}
document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
